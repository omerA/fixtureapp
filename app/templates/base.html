<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fixture{% endblock %}</title>

  <link rel="icon" href="{{ url_for('static', path='logo.svg') }}" type="image/svg+xml"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"/>

  <!-- Dark mode: set class before render to prevent flash of wrong theme -->
  <script>
    (function(){
      var s=localStorage.getItem('theme');
      var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
      if(s==='dark'||(s===null&&d)) document.documentElement.classList.add('dark');
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <script>
    /* All Tailwind colors reference CSS variables so html.dark overrides
       propagate automatically — no dark: prefix needed on every element. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* Primary — Grass Green */
            "primary":                  "var(--clr-primary)",
            "primary-container":        "var(--clr-primary-container)",
            "primary-fixed":            "var(--clr-primary-fixed)",
            "on-primary":               "var(--clr-on-primary)",
            "on-primary-container":     "var(--clr-on-primary-container)",
            "grass-green-light":        "var(--clr-grass-green-light)",
            /* Secondary */
            "secondary":                "var(--clr-secondary)",
            "secondary-container":      "var(--clr-secondary-container)",
            "on-secondary":             "var(--clr-on-secondary)",
            "on-secondary-container":   "var(--clr-on-secondary-container)",
            /* Tertiary — Sunrise Orange */
            "sunrise-orange":           "var(--clr-tertiary)",
            "sunrise-orange-light":     "var(--clr-tertiary-light)",
            /* Deep backgrounds (fixed — don't change with theme) */
            "stadium-navy":             "var(--clr-stadium-navy)",
            "stadium-navy-mid":         "var(--clr-stadium-navy-mid)",
            /* Surfaces */
            "chalk-white":              "var(--clr-chalk-white)",
            "surface":                  "var(--clr-surface)",
            "surface-dim":              "var(--clr-surface-dim)",
            "surface-container":        "var(--clr-surface-container)",
            "surface-container-low":    "var(--clr-surface-low)",
            "surface-container-lowest": "var(--clr-chalk-white)",
            "surface-container-high":   "var(--clr-surface-high)",
            /* Text */
            "on-surface":               "var(--clr-on-surface)",
            "on-surface-variant":       "var(--clr-on-surface-var)",
            "outline":                  "var(--clr-outline)",
            "outline-variant":          "var(--clr-outline-var)",
            "sideline-grey":            "var(--clr-sideline-grey)",
            /* Error */
            "error":                    "var(--clr-error)",
            "error-container":          "var(--clr-error-container)",
            "on-error":                 "var(--clr-on-error)",
            "on-error-container":       "var(--clr-on-error-container)",
          },
          fontFamily: {
            headline: ["Lexend", "system-ui", "sans-serif"],
            body:     ["Inter",  "system-ui", "sans-serif"],
          },
        }
      }
    }
  </script>

  {% block head %}{% endblock %}
</head>
<body class="bg-surface text-on-surface min-h-screen">

  {% if user %}
  <!-- Sidebar: desktop only, logged-in users -->
  <aside class="hidden md:flex flex-col fixed left-0 top-0 h-full w-64 bg-chalk-white border-r border-outline-variant z-50 p-6">
    <a href="/" class="flex items-center gap-3 mb-8" style="text-decoration:none;">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="40" height="40" aria-hidden="true" style="flex-shrink:0;">
        <rect width="100" height="100" rx="20" fill="#2E7D32"/>
        <path d="M30 25H70V35H45V45H65V55H45V75H30V25Z" fill="white"/>
        <path d="M70 75L85 60L70 45V75Z" fill="#1A237E" opacity="0.8"/>
        <circle cx="80" cy="25" r="8" fill="#FF9800"/>
      </svg>
      <span class="font-headline font-bold text-xl text-primary">Fixture</span>
    </a>

    <nav class="flex-1 space-y-1">
      <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sideline-grey hover:bg-surface-container transition-all text-sm font-semibold" style="text-decoration:none;">
        <span class="material-symbols-outlined" style="font-size:20px;">groups</span>
        My Teams
      </a>
      <a href="/onboard" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sideline-grey hover:bg-surface-container transition-all text-sm font-semibold" style="text-decoration:none;">
        <span class="material-symbols-outlined" style="font-size:20px;">manage_search</span>
        Find Teams
      </a>
      <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sideline-grey hover:bg-surface-container transition-all text-sm font-semibold" style="text-decoration:none;">
        <span class="material-symbols-outlined" style="font-size:20px;">settings</span>
        Settings
      </a>
    </nav>

    <div class="border-t border-outline-variant pt-4 space-y-1">
      <button onclick="toggleTheme()" class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-sideline-grey hover:bg-surface-container transition-all text-sm font-semibold text-left" style="background:transparent;border:none;cursor:pointer;" aria-label="Toggle dark mode">
        <span class="material-symbols-outlined theme-icon" style="font-size:20px;">dark_mode</span>
        Toggle theme
      </button>
      <form method="post" action="/logout">
        <button type="submit" class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-sideline-grey hover:bg-surface-container transition-all text-sm font-semibold text-left" style="background:transparent;border:none;cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size:20px;">logout</span>
          Log out
        </button>
      </form>
    </div>
  </aside>
  {% endif %}

  <!-- Content wrapper (offset from sidebar on desktop) -->
  <div class="{% if user %}md:ml-64{% endif %}">

    <!-- Top bar -->
    <header class="sticky top-0 z-40 bg-chalk-white border-b border-outline-variant">
      <div class="flex items-center justify-between h-16 px-4 {% if not user %}md:px-10 max-w-5xl mx-auto{% endif %}">

        <!-- Logo (always visible on mobile; hidden on desktop when sidebar is active) -->
        <a href="/" class="flex items-center gap-2 {% if user %}md:opacity-0 md:pointer-events-none{% endif %}" style="text-decoration:none;">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="32" height="32" aria-hidden="true" style="flex-shrink:0;">
            <rect width="100" height="100" rx="20" fill="#2E7D32"/>
            <path d="M30 25H70V35H45V45H65V55H45V75H30V25Z" fill="white"/>
            <path d="M70 75L85 60L70 45V75Z" fill="#1A237E" opacity="0.8"/>
            <circle cx="80" cy="25" r="8" fill="#FF9800"/>
          </svg>
          <span class="font-headline font-bold text-lg text-primary">Fixture</span>
        </a>

        <!-- Right-side nav -->
        {% if user %}
        <div class="flex items-center gap-4 md:hidden">
          <a href="/dashboard" class="text-sm font-semibold text-sideline-grey" style="text-decoration:none;">Teams</a>
          <a href="/onboard" class="text-sm font-semibold text-sideline-grey" style="text-decoration:none;">Find</a>
          <a href="/settings" class="text-sm font-semibold text-sideline-grey" style="text-decoration:none;">Settings</a>
          <form method="post" action="/logout" class="inline">
            <button type="submit" class="text-sm font-semibold text-sideline-grey" style="background:transparent;border:none;cursor:pointer;padding:0;">Out</button>
          </form>
          <button onclick="toggleTheme()" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="material-symbols-outlined theme-icon" style="font-size:20px;">dark_mode</span>
          </button>
        </div>
        <div class="hidden md:flex items-center">
          <button onclick="toggleTheme()" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="material-symbols-outlined theme-icon" style="font-size:20px;">dark_mode</span>
          </button>
        </div>
        {% else %}
        <div class="flex items-center gap-3">
          <button onclick="toggleTheme()" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="material-symbols-outlined theme-icon" style="font-size:20px;">dark_mode</span>
          </button>
          <a href="/login" class="text-sm font-semibold text-sideline-grey" style="text-decoration:none;">Log in</a>
          <a href="/register" class="text-sm font-bold text-on-primary bg-primary px-4 py-2 rounded-lg" style="text-decoration:none;">Sign up</a>
        </div>
        {% endif %}

      </div>
    </header>

    <!-- Page content -->
    {% block full_page %}
    <main class="px-4 md:px-10 py-8">
      <div class="max-w-5xl mx-auto">
        {% block content %}{% endblock %}
      </div>
    </main>
    {% endblock %}

  </div><!-- /content wrapper -->

  <script>
    function toggleTheme() {
      var html = document.documentElement;
      /* Temporarily add transition class so the switch animates smoothly */
      html.classList.add('theme-transitioning');
      html.classList.toggle('dark');
      var isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      _syncThemeIcons(isDark);
      setTimeout(function(){ html.classList.remove('theme-transitioning'); }, 300);
    }

    function _syncThemeIcons(isDark) {
      document.querySelectorAll('.theme-icon').forEach(function(el) {
        el.textContent = isDark ? 'light_mode' : 'dark_mode';
      });
    }

    /* Sync icons to current theme once DOM is ready */
    document.addEventListener('DOMContentLoaded', function() {
      _syncThemeIcons(document.documentElement.classList.contains('dark'));
    });
  </script>

</body>
</html>
