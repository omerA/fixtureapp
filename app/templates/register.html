{% extends "base.html" %}
{% block title %}Sign up — TooInvolved{% endblock %}

{% block content %}
<div style="max-width:400px;margin:0 auto;padding:40px 0 60px;">

  <!-- Brand mark -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
    <div class="ti-crest" style="width:44px;height:44px;border-radius:12px;background:var(--ti-accent);font-size:16px;font-weight:800;">
      <svg width="22" height="22" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="11" stroke="#fff" stroke-width="2.4" fill="none"/>
        <circle cx="15" cy="15" r="3.4" fill="#fff"/>
      </svg>
    </div>
    <div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;">Create your account</div>
      <div style="font-size:13px;color:var(--ti-muted);margin-top:2px;">Free, no credit card required.</div>
    </div>
  </div>

  {% if error %}
  <div style="background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:20px;">
    {{ error }}
  </div>
  {% endif %}

  <!-- Google -->
  <a href="/auth/google" style="
    display:flex;align-items:center;justify-content:center;gap:10px;
    height:48px;border-radius:12px;border:1px solid var(--ti-border-strong);
    background:#fff;text-decoration:none;font-size:15px;font-weight:600;
    color:var(--ti-text);letter-spacing:-0.1px;
  ">
    <svg width="18" height="18" viewBox="0 0 18 18"><g><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></g></svg>
    Continue with Google
  </a>

  <!-- Divider -->
  <div style="display:flex;align-items:center;gap:12px;margin:20px 0;">
    <div style="flex:1;height:1px;background:var(--ti-border);"></div>
    <span style="font-size:12px;color:var(--ti-faint);font-weight:500;">or</span>
    <div style="flex:1;height:1px;background:var(--ti-border);"></div>
  </div>

  <form method="post" action="/register" style="display:flex;flex-direction:column;gap:16px;">
    <div>
      <label style="display:block;font-size:12px;font-weight:600;color:var(--ti-muted);letter-spacing:0.3px;text-transform:uppercase;margin-bottom:6px;">Email</label>
      <input type="email" name="email" value="{{ email or '' }}" autofocus
             class="ti-input" placeholder="you@example.com">
    </div>
    <div>
      <label style="display:block;font-size:12px;font-weight:600;color:var(--ti-muted);letter-spacing:0.3px;text-transform:uppercase;margin-bottom:6px;">Password</label>
      <input type="password" name="password" minlength="8"
             class="ti-input" placeholder="At least 8 characters">
    </div>
    <button type="submit" class="ti-btn ti-btn-secondary" style="margin-top:4px;">
      Sign up with email
    </button>
  </form>

  <p style="margin-top:20px;font-size:14px;color:var(--ti-muted);text-align:center;">
    Already have an account?
    <a href="/login" style="color:var(--ti-accent);font-weight:600;text-decoration:none;">Log in</a>
  </p>

</div>
{% endblock %}
